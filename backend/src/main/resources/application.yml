spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/class_management?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:7200000}
server:
  port: 8080
ai:
  deepseek:
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
    model: ${DEEPSEEK_MODEL:deepseek-flash}
    connect-timeout-seconds: ${DEEPSEEK_CONNECT_TIMEOUT:5}
    request-timeout-seconds: ${DEEPSEEK_REQUEST_TIMEOUT:25}
    total-timeout-seconds: ${DEEPSEEK_TOTAL_TIMEOUT:90}
    max-history: ${DEEPSEEK_MAX_HISTORY:10}
    max-tokens: ${DEEPSEEK_MAX_TOKENS:2000}
    max-rounds: ${DEEPSEEK_MAX_ROUNDS:6}
