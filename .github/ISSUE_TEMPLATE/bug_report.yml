name: Bug 报告
description: 功能不符合预期、报错、崩溃
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜索已有 Issue。日志和截图里**务必删掉** API Key、密码、学生真实姓名与学号。
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 期望行为与实际行为
      placeholder: |
        期望：成绩列表翻到最后一页显示剩余 4 条
        实际：最后一页返回空列表
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 用管理员登录
        2. 进入成绩页
        3. 选择某场考试
        4. 翻到第 3 页
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: 运行方式
      options:
        - 便携版（H2，免安装）
        - 开发模式（MySQL + 前后端分离）
        - 其它 / 不确定
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: 版本信息
      description: JDK、Node、数据库版本与操作系统
      placeholder: "JDK 17.0.9 / Node 22.12.0 / MySQL 8.4.11 / Windows 11"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 相关日志
      description: 已去除敏感信息的报错片段
      render: shell
    validations:
      required: false
