name: 功能建议
description: 想要的新能力或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提之前想一下：这个功能会解决谁的问题？如果只是「感觉应该有一个」，可以先在 Discussions 里聊。
  - type: textarea
    id: problem
    attributes:
      label: 现在遇到的困难
      description: 描述场景，不要直接给方案
      placeholder: 每次月考后要把三个班的成绩合并统计，现在只能一个一个班导出再手工拼
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望的解决方式
      placeholder: 成绩页支持多选班级，导出一份合并的 CSV
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其它办法
      placeholder: 试过直接查数据库，但老师们不会用 SQL
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: 涉及范围
      multiple: true
      options:
        - 前端界面
        - 后端接口
        - 数据库迁移
        - AI 助手
        - 文档
        - 构建与发布
    validations:
      required: false
